<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazaarly – Online Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#14213d;--mu:#667085;--bd:#e2e6ee;--pr:#14213d;--ac:#fca311;--ok:#12877a;--er:#d64545;--sh:0 10px 30px rgba(20,33,61,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--tx:#eef1f8;--mu:#9aa5bf;--bd:#27324f;--pr:#fca311;--sh:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--tx:#eef1f8;--mu:#9aa5bf;--bd:#27324f;--pr:#fca311;--sh:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--pr);color:var(--bg);padding:.65rem 1.1rem;border-radius:10px;font-weight:700;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.ac{background:var(--ac);color:#14213d}.btn.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:.35rem .7rem;font-size:.85rem}.btn.dn{background:var(--er);color:#fff}.btn[disabled]{opacity:.45;pointer-events:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:.8rem;align-items:center;padding:.7rem 1.2rem;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-size:1.5rem;font-weight:800;cursor:pointer}.logo b{color:var(--ac)}
nav .sp{flex:1}.nl{background:none;padding:.4rem .7rem;border-radius:8px;font-weight:500}.nl:hover,.nl.on{background:var(--bg)}
#cartBtn{position:relative}#badge{position:absolute;top:-4px;right:-4px;background:var(--ac);color:#14213d;border-radius:99px;font-size:.7rem;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center}
.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.5)}}
main{max-width:1180px;margin:0 auto;padding:1.2rem}
.hero{position:relative;overflow:hidden;background:var(--pr);color:var(--bg);border-radius:22px;padding:3rem 2rem;margin-bottom:1.5rem;display:grid;grid-template-columns:1.2fr 1fr;gap:1rem;align-items:center}
:root[data-theme="dark"] .hero{color:#14213d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#14213d}}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;margin-bottom:.8rem}.hero p{opacity:.85;max-width:44ch;margin-bottom:1.2rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.tiles span{font-size:2.4rem;background:rgba(255,255,255,.14);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;animation:fl 4s ease-in-out infinite;animation-delay:calc(var(--i)*.35s)}
@keyframes fl{50%{transform:translateY(-10px) rotate(4deg)}}
.hero>*{animation:up .7s both}.hero>*:nth-child(2){animation-delay:.2s}@keyframes up{from{opacity:0;transform:translateY(24px)}}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:2rem 1.2rem}.tiles{display:none}}
.bar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.chip{padding:.4rem .9rem;border-radius:99px;background:var(--card);border:1px solid var(--bd);transition:.2s}.chip.on{background:var(--pr);color:var(--bg);border-color:var(--pr)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.55rem .8rem;width:100%}
.bar input[type=search]{flex:1;min-width:180px}.bar select{width:auto}.bar label{font-size:.85rem;color:var(--mu);display:flex;gap:.5rem;align-items:center}.bar input[type=range]{width:120px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:up .5s both;animation-delay:calc(var(--i)*40ms)}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh)}
.img{height:150px;display:grid;place-items:center;font-size:4.2rem;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .3s}.card:hover .img{transform:scale(1.06)}
.card .in{padding:.9rem}.card h3{font-size:1.05rem;margin-bottom:.2rem}.mu{color:var(--mu);font-size:.85rem}.pr{font-weight:700;font-size:1.1rem}.st{color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.empty{text-align:center;padding:3rem;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:grid;place-items:center;padding:1rem;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.md{background:var(--card);border-radius:18px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:1.4rem;animation:pop .3s cubic-bezier(.2,1.3,.4,1);position:relative}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.x{position:absolute;top:.7rem;right:.9rem;background:none;font-size:1.5rem;color:var(--mu)}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);z-index:60;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem;animation:sl .3s;box-shadow:var(--sh);padding-top:calc(1.2rem + env(safe-area-inset-top,0px))}
@keyframes sl{from{transform:translateX(100%)}}
.ci{display:flex;gap:.7rem;align-items:center;border-bottom:1px solid var(--bd);padding:.6rem 0}.ci .e{font-size:2rem}.ci>div{flex:1}
.q{display:inline-flex;align-items:center;gap:.4rem}.q button{width:26px;height:26px;border-radius:7px;background:var(--bg)}
.f{margin-bottom:.8rem}.f label{font-weight:500;font-size:.9rem;display:block;margin-bottom:.25rem}.er{color:var(--er);font-size:.8rem;min-height:1em;display:block}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--bd);font-size:.9rem}th{background:var(--bg)}
.tw{overflow-x:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1rem}.stats b{font-size:1.5rem;display:block}
.rv{border-top:1px solid var(--bd);padding:.6rem 0}.stars button{background:none;font-size:1.6rem;color:var(--bd)}.stars button.on{color:var(--ac)}
.tag{padding:.15rem .6rem;border-radius:99px;background:var(--bg);font-size:.8rem;font-weight:700}
#toasts{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:.5rem}
.t{background:var(--pr);color:var(--bg);padding:.7rem 1.2rem;border-radius:12px;box-shadow:var(--sh);animation:up .3s}.t.bad{background:var(--er);color:#fff}
.ok{width:80px;height:80px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2.5rem;margin:0 auto 1rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav><span class="logo" onclick="go('shop')">Bazaar<b>ly</b></span><span class="sp"></span>
<button class="nl on" data-v="shop" onclick="go('shop')">Shop</button>
<button class="nl hide" id="nOrd" data-v="orders" onclick="go('orders')">My orders</button>
<button class="nl hide" id="nAdm" data-v="admin" onclick="go('admin')">Admin</button>
<button class="nl" onclick="theme()" aria-label="Toggle theme">🌓</button>
<button class="nl" id="cartBtn" onclick="cartOpen()">🛒 Cart<span id="badge">0</span></button>
<button class="btn sm ac" id="authBtn" onclick="authOpen()">Log in</button></nav>
<main>
<section id="v-shop">
<div class="hero"><div><h1>Everything local, in one bazaar.</h1><p>Browse, compare and order from our growing marketplace. Create an account to review products and track orders.</p><button class="btn ac" onclick="document.getElementById('q').focus()">Start browsing</button></div>
<div class="tiles"><span style="--i:0">🎧</span><span style="--i:1">👟</span><span style="--i:2">📚</span><span style="--i:3">🪴</span><span style="--i:4">⌚</span><span style="--i:5">🎒</span></div></div>
<div class="bar"><input type="search" id="q" placeholder="Search products…" oninput="F.q=this.value;shop()">
<select id="sort" onchange="F.sort=this.value;shop()"><option value="new">Newest</option><option value="pa">Price: low to high</option><option value="pd">Price: high to low</option><option value="rt">Top rated</option></select>
<label>Up to <input type="range" id="mx" oninput="F.max=+this.value;shop()"><b id="mxv"></b></label></div>
<div class="bar" id="cats"></div><div class="grid" id="grid"></div></section>
<section id="v-orders" class="hide"></section><section id="v-admin" class="hide"></section>
</main><div id="mount"></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN'),hash=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const seed=[['Wireless Headphones','Electronics',2999,25,'🎧','Noise-reducing over-ear headphones with 30-hour battery.'],['Smart Watch','Electronics',4499,12,'⌚','Tracks steps, sleep and heart rate. Water resistant.'],['Bluetooth Speaker','Electronics',1799,30,'🔊','Portable speaker with deep bass and 12-hour playtime.'],['Running Shoes','Fashion',2499,40,'👟','Lightweight cushioned shoes for daily runs.'],['Denim Jacket','Fashion',1999,18,'🧥','Classic fit jacket in washed blue denim.'],['Backpack','Fashion',1299,50,'🎒','Water-resistant 25L backpack with laptop sleeve.'],['Indoor Plant Set','Home',899,35,'🪴','Three easy-care plants in ceramic pots.'],['Table Lamp','Home',749,22,'💡','Warm LED lamp with touch dimmer.'],['Coffee Maker','Home',3299,9,'☕','Brews up to 6 cups with a reusable filter.'],['Novel Collection','Books',649,60,'📚','Set of four bestselling contemporary novels.'],['Study Planner','Books',299,80,'📓','Undated weekly planner with goal trackers.'],['Yoga Mat','Sports',799,45,'🧘','Non-slip 6mm mat with carry strap.'],['Cricket Bat','Sports',2199,14,'🏏','Kashmir willow bat, short handle.']].map((p,i)=>({id:i+1,name:p[0],cat:p[1],price:p[2],stock:p[3],img:p[4],desc:p[5],rev:[]}));
let S={users:ld('bz_users',[{name:'Admin',email:'admin@bazaarly.com',pw:hash('admin123'),role:'admin'}]),products:ld('bz_products',seed),orders:ld('bz_orders',[]),cart:ld('bz_cart',{}),me:ld('bz_me',null)};
const save=()=>{['users','products','orders','cart','me'].forEach(k=>sv('bz_'+k,S[k]))};
const F={q:'',cat:'All',sort:'new',max:null},pal=['#ffe8b8,#ffd1a1','#cfe8ff,#b8d4ff','#d6f5e8,#b4e6d2','#fbd5e0,#f4b6cb','#e5dcff,#cbbcff'];
const avg=p=>p.rev.length?p.rev.reduce((a,r)=>a+r.s,0)/p.rev.length:0,stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const isAdm=()=>S.me&&S.me.role==='admin';
function toast(m,bad){const t=document.createElement('div');t.className='t'+(bad?' bad':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2600)}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function modal(h){$('#mount').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="md" role="dialog" aria-modal="true"><button class="x" onclick="closeM()" aria-label="Close">×</button>${h}</div></div>`}
const closeM=()=>$('#mount').innerHTML='';
function go(v){['shop','orders','admin'].forEach(x=>{$('#v-'+x).classList.toggle('hide',x!==v)});document.querySelectorAll('.nl[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='orders')orders();if(v==='admin')admin();window.scrollTo({top:0,behavior:'smooth'})}
function chrome(){$('#authBtn').textContent=S.me?`Log out (${S.me.name.split(' ')[0]})`:'Log in';$('#authBtn').onclick=S.me?logout:authOpen;$('#nOrd').classList.toggle('hide',!S.me||isAdm());$('#nAdm').classList.toggle('hide',!isAdm());const n=Object.values(S.cart).reduce((a,b)=>a+b,0),b=$('#badge');b.textContent=n;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
/* SHOP */
function shop(){const cats=['All',...new Set(S.products.map(p=>p.cat))],top=Math.max(...S.products.map(p=>p.price),100);if(F.max===null||F.max>top)F.max=top;const mx=$('#mx');mx.max=top;mx.value=F.max;$('#mxv').textContent=inr(F.max);
$('#cats').innerHTML=cats.map(c=>`<button class="chip ${c===F.cat?'on':''}" onclick="F.cat='${c}';shop()">${c}</button>`).join('');
let l=S.products.filter(p=>(F.cat==='All'||p.cat===F.cat)&&p.price<=F.max&&(p.name+p.desc+p.cat).toLowerCase().includes(F.q.toLowerCase().trim()));
l.sort({new:(a,b)=>b.id-a.id,pa:(a,b)=>a.price-b.price,pd:(a,b)=>b.price-a.price,rt:(a,b)=>avg(b)-avg(a)}[F.sort]);
$('#grid').innerHTML=l.length?l.map((p,i)=>`<div class="card" style="--i:${Math.min(i,12)};--c1:${pal[p.id%5].split(',')[0]};--c2:${pal[p.id%5].split(',')[1]}" onclick="detail(${p.id})"><div class="img">${esc(p.img)}</div><div class="in"><h3>${esc(p.name)}</h3><div class="mu">${esc(p.cat)} · <span class="st">${stars(avg(p))}</span> (${p.rev.length})</div><div class="row" style="margin-top:.5rem"><span class="pr">${inr(p.price)}</span><button class="btn sm" ${p.stock<1?'disabled':''} onclick="event.stopPropagation();add(${p.id})">${p.stock<1?'Sold out':'Add'}</button></div></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">No products match. Try a different search or raise the price limit.</div>'}
function detail(id){const p=S.products.find(x=>x.id===id);if(!p)return;const [c1,c2]=pal[p.id%5].split(',');
modal(`<div class="img" style="--c1:${c1};--c2:${c2};border-radius:14px;height:180px;margin-bottom:1rem">${esc(p.img)}</div><h2>${esc(p.name)}</h2><p class="mu">${esc(p.cat)} · <span class="st">${stars(avg(p))}</span> ${avg(p).toFixed(1)} (${p.rev.length} reviews) · ${p.stock} in stock</p><p style="margin:.7rem 0">${esc(p.desc)}</p><div class="row"><span class="pr" style="font-size:1.5rem">${inr(p.price)}</span><button class="btn ac" ${p.stock<1?'disabled':''} onclick="add(${p.id})">Add to cart</button></div>
<h3 style="margin:1.2rem 0 .4rem">Reviews</h3>${p.rev.map(r=>`<div class="rv"><b>${esc(r.n)}</b> <span class="st">${stars(r.s)}</span><div>${esc(r.t)}</div></div>`).join('')||'<p class="mu">No reviews yet. Be the first to review.</p>'}
${S.me?`<div class="f" style="margin-top:1rem"><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">★</button>`).join('')}</div><textarea id="rt" rows="2" placeholder="Share your experience (min 5 characters)"></textarea><span class="er" id="rer"></span><button class="btn sm" onclick="review(${p.id})">Post review</button></div>`:'<p class="mu" style="margin-top:.8rem">Log in to write a review.</p>'}`)}
let RS=0;function rate(n){RS=n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<n))}
function review(id){const t=$('#rt').value.trim();if(!RS||t.length<5){$('#rer').textContent='Choose a star rating and write at least 5 characters.';return}
const p=S.products.find(x=>x.id===id);p.rev=p.rev.filter(r=>r.e!==S.me.email);p.rev.push({e:S.me.email,n:S.me.name,s:RS,t});RS=0;save();shop();detail(id);toast('Review posted')}
/* CART */
function add(id){const p=S.products.find(x=>x.id===id);if((S.cart[id]||0)>=p.stock){toast('No more stock available',1);return}S.cart[id]=(S.cart[id]||0)+1;save();chrome();toast(p.name+' added to cart')}
function cartOpen(){const items=Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id==id),q})).filter(i=>i.p),tot=items.reduce((a,i)=>a+i.p.price*i.q,0);
$('#mount').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><aside class="dr"><div class="row"><h2>Your cart</h2><button class="x" style="position:static" onclick="closeM()" aria-label="Close">×</button></div><div style="flex:1;overflow:auto">${items.map(({p,q})=>`<div class="ci"><span class="e">${esc(p.img)}</span><div><b>${esc(p.name)}</b><div class="mu">${inr(p.price)}</div></div><span class="q"><button onclick="qty(${p.id},-1)">−</button>${q}<button onclick="qty(${p.id},1)">+</button></span></div>`).join('')||'<div class="empty">Your cart is empty.<br>Add something you like from the shop.</div>'}</div><div class="row"><b>Total</b><span class="pr">${inr(tot)}</span></div><button class="btn ac" ${items.length?'':'disabled'} onclick="checkout()">Checkout</button></aside></div>`}
function qty(id,d){const p=S.products.find(x=>x.id===id),n=(S.cart[id]||0)+d;if(n>p.stock){toast('Only '+p.stock+' in stock',1);return}if(n<=0)delete S.cart[id];else S.cart[id]=n;save();chrome();cartOpen()}
function checkout(){if(!S.me){closeM();toast('Log in to place your order',1);authOpen();return}
modal(`<h2>Checkout</h2><p class="mu" style="margin-bottom:1rem">Delivery details</p>${[['cn','Full name','text',S.me.name],['cp','Phone (10 digits)','tel',''],['ca','Address','text',''],['cz','PIN code (6 digits)','text','']].map(f=>`<div class="f"><label>${f[1]}</label><input id="${f[0]}" type="${f[2]}" value="${esc(f[3])}"><span class="er" id="e${f[0]}"></span></div>`).join('')}<div class="f"><label>Payment</label><select id="cm"><option>Cash on delivery</option><option>UPI</option><option>Card</option></select></div><button class="btn ac" style="width:100%" onclick="place()">Place order</button>`)}
function place(){const v=i=>$('#'+i).value.trim(),R={cn:[v('cn').length>=3,'Enter your full name.'],cp:[/^[6-9]\d{9}$/.test(v('cp')),'Enter a valid 10-digit mobile number.'],ca:[v('ca').length>=8,'Enter your full address (at least 8 characters).'],cz:[/^\d{6}$/.test(v('cz')),'Enter a 6-digit PIN code.']};let ok=true;
for(const k in R){$('#e'+k).textContent=R[k][0]?'':R[k][1];if(!R[k][0])ok=false}if(!ok)return;
const items=Object.entries(S.cart).map(([id,q])=>{const p=S.products.find(x=>x.id==id);return{id:p.id,name:p.name,price:p.price,qty:q}});
const o={id:'BZ'+Date.now().toString().slice(-6),email:S.me.email,items,total:items.reduce((a,i)=>a+i.price*i.qty,0),status:'Placed',date:new Date().toLocaleString('en-IN'),addr:v('ca')+' – '+v('cz'),pay:$('#cm').value};
items.forEach(i=>S.products.find(p=>p.id===i.id).stock-=i.qty);S.orders.unshift(o);S.cart={};save();chrome();shop();
modal(`<div style="text-align:center"><div class="ok">✓</div><h2>Order placed!</h2><p class="mu" style="margin:.5rem 0 1rem">Order ${o.id} · ${inr(o.total)}</p><button class="btn" onclick="closeM();go('orders')">View my orders</button></div>`)}
function orders(){const l=S.orders.filter(o=>o.email===S.me?.email);$('#v-orders').innerHTML=`<h2 style="margin-bottom:1rem">My orders</h2>`+(l.map(o=>`<div class="card" style="cursor:default;padding:1rem;margin-bottom:.8rem"><div class="row"><b>${o.id}</b><span class="tag">${o.status}</span></div><div class="mu">${o.date} · ${esc(o.pay)}</div><div style="margin:.5rem 0">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(', ')}</div><b>${inr(o.total)}</b></div>`).join('')||'<div class="empty">No orders yet. Your purchases will show up here.</div>')}
/* AUTH */
function authOpen(tab='login'){const r=tab==='reg';modal(`<h2>${r?'Create your account':'Welcome back'}</h2><div class="tabs" style="margin:.8rem 0"><button class="chip ${r?'':'on'}" onclick="authOpen('login')">Log in</button><button class="chip ${r?'on':''}" onclick="authOpen('reg')">Register</button></div>
${r?`<div class="f"><label>Full name</label><input id="an"><span class="er" id="ean"></span></div>`:''}<div class="f"><label>Email</label><input id="ae" type="email"><span class="er" id="eae"></span></div><div class="f"><label>Password</label><input id="ap" type="password"><span class="er" id="eap"></span></div>
${r?`<div class="f"><label>Confirm password</label><input id="ac" type="password"><span class="er" id="eac"></span></div>`:`<p class="mu" style="margin-bottom:.8rem">Demo admin: admin@bazaarly.com / admin123</p>`}<button class="btn" style="width:100%" onclick="${r?'reg()':'login()'}">${r?'Create account':'Log in'}</button>`)}
function reg(){const n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,c=$('#ac').value;
const E={an:n.length<3?'Name must be at least 3 characters.':'',ae:!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)?'Enter a valid email address.':S.users.some(u=>u.email===e)?'This email is already registered.':'',ap:p.length<6||!/\d/.test(p)?'Use at least 6 characters including a number.':'',ac:c!==p?'Passwords do not match.':''};
for(const k in E)$('#e'+k).textContent=E[k];if(Object.values(E).some(Boolean))return;
S.me={name:n,email:e,pw:hash(p),role:'user'};S.users.push(S.me);save();closeM();chrome();toast('Welcome, '+n.split(' ')[0]+'!')}
function login(){const e=$('#ae').value.trim().toLowerCase(),u=S.users.find(x=>x.email===e&&x.pw===hash($('#ap').value));
if(!u){$('#eap').textContent='Email or password is incorrect.';return}S.me=u;save();closeM();chrome();toast('Logged in as '+u.name);if(isAdm())go('admin')}
function logout(){S.me=null;save();chrome();go('shop');toast('Logged out')}
/* ADMIN */
let AT='products';
function admin(){if(!isAdm()){go('shop');return}const rev=S.orders.reduce((a,o)=>a+o.total,0);
$('#v-admin').innerHTML=`<h2 style="margin-bottom:1rem">Admin dashboard</h2><div class="stats"><div><b>${S.products.length}</b>Products</div><div><b>${S.orders.length}</b>Orders</div><div><b>${inr(rev)}</b>Revenue</div><div><b>${S.users.length}</b>Users</div></div>
<div class="tabs"><button class="chip ${AT==='products'?'on':''}" onclick="AT='products';admin()">Products</button><button class="chip ${AT==='orders'?'on':''}" onclick="AT='orders';admin()">Orders</button></div>`+
(AT==='products'?`<button class="btn sm ac" style="margin-bottom:.8rem" onclick="pform()">+ Add product</button><div class="tw"><table><tr><th>Item</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${S.products.map(p=>`<tr><td>${esc(p.img)} ${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${inr(p.price)}</td><td>${p.stock}</td><td style="white-space:nowrap"><button class="btn sm gh" onclick="pform(${p.id})">Edit</button> <button class="btn sm dn" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}</table></div>`:
`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>${S.orders.map(o=>`<tr><td>${o.id}<div class="mu">${o.date}</div></td><td>${esc(o.email)}</td><td>${inr(o.total)}</td><td><select style="width:auto" onchange="ost('${o.id}',this.value)">${['Placed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No orders have been placed yet.</td></tr>'}</table></div>`)}
function ost(id,s){S.orders.find(o=>o.id===id).status=s;save();toast('Order '+id+' marked '+s)}
function del(id){if(!confirm('Delete this product?'))return;S.products=S.products.filter(p=>p.id!==id);delete S.cart[id];save();chrome();admin();shop();toast('Product deleted')}
function pform(id){const p=S.products.find(x=>x.id===id)||{name:'',cat:'Electronics',price:'',stock:'',img:'📦',desc:''};
modal(`<h2>${id?'Edit':'Add'} product</h2><br>${[['pn','Name',p.name,'text'],['pc','Category',p.cat,'text'],['pp','Price (₹)',p.price,'number'],['ps','Stock',p.stock,'number'],['pi','Emoji icon',p.img,'text'],['pd','Description',p.desc,'text']].map(f=>`<div class="f"><label>${f[1]}</label><input id="${f[0]}" type="${f[3]}" value="${esc(f[2])}"><span class="er" id="e${f[0]}"></span></div>`).join('')}<button class="btn" style="width:100%" onclick="psave(${id||0})">Save product</button>`)}
function psave(id){const v=i=>$('#'+i).value.trim(),d={name:v('pn'),cat:v('pc'),price:+v('pp'),stock:+v('ps'),img:v('pi')||'📦',desc:v('pd')};
const E={pn:d.name.length<2?'Enter a product name.':'',pc:!d.cat?'Enter a category.':'',pp:!(d.price>0)?'Price must be greater than 0.':'',ps:!(Number.isInteger(d.stock)&&d.stock>=0)?'Stock must be a whole number, 0 or more.':'',pd:d.desc.length<5?'Add a short description.':''};
for(const k in E)$('#e'+k).textContent=E[k];if(Object.values(E).some(Boolean))return;
if(id)Object.assign(S.products.find(p=>p.id===id),d);else S.products.push({...d,id:Math.max(0,...S.products.map(p=>p.id))+1,rev:[]});
save();closeM();admin();shop();toast('Product saved')}
chrome();shop();
</script></body></html>
